[tasks.default]
description = "Install dependencies, build and install CLI binaries, and bootstrap the tracker"
hide = true
run = '''
bun install
bun run --filter '*' build
bun run --filter '*' install:bin
mise run beads:install
export PATH="$HOME/.local/bin:$PATH"
beeswax beads bootstrap --environment mise
mise exec -- bee setup --actor "${BD_ACTOR:-sys-beeswax}"
beeswax sync
'''

[tasks."beads:install"]
description = "Build and install the pinned Beads fork from its persistent maintainer checkout"
tools.rust = "1.99.1"
env.RUSTUP_TOOLCHAIN = "1.99.1"
run = '''
beads_repo="$HOME/dev/projects/beads_rust"
beads_url="https://github.com/codethread/beads_rust.git"
beads_revision="b77ae7094e9fde7cba304ba00d306ec483c6bdd2"
if [ ! -e "$beads_repo" ]; then
  mkdir -p "$HOME/dev/projects"
  git clone "$beads_url" "$beads_repo"
fi
if [ -n "$(git --no-optional-locks -C "$beads_repo" status --porcelain)" ]; then
  echo "Cannot install br: $beads_repo has local changes. Commit or stash them before setup." >&2
  exit 1
fi
if [ "$(git -C "$beads_repo" rev-parse HEAD)" != "$beads_revision" ]; then
  git -C "$beads_repo" cat-file -e "$beads_revision^{commit}" 2>/dev/null || \
    git -C "$beads_repo" fetch "$beads_url" "$beads_revision"
  git -C "$beads_repo" switch --detach "$beads_revision"
fi
GIT_OPTIONAL_LOCKS=0 cargo build --manifest-path "$beads_repo/Cargo.toml" --target-dir "$beads_repo/target" \
  --release --locked --no-default-features --bin br
beeswax artifacts install br --source "$beads_repo/target/release" --directory "$HOME/.local/bin"
beads_selected="$(command -v br || true)"
if [ -z "$beads_selected" ] || [ ! "$beads_selected" -ef "$HOME/.local/bin/br" ]; then
  echo "Warning: PATH selects ${beads_selected:-no br executable}; put $HOME/.local/bin first before using Hive." >&2
fi
"$HOME/.local/bin/br" version --json
'''

[tasks.fmt]
description = "Format repository files"
run = "bun run fmt"

[tasks.lint]
description = "Check repository lint rules"
run = "bun run lint"

[tasks.typecheck]
description = "Check TypeScript across workspaces"
run = "bun run typecheck"

[tasks.test]
description = "Run a focused test file"
usage = '''
arg "<file>" help="Test file path from the repository root, e.g. ./lib/shared/src/bees.test.ts"
arg "[args]" var=#true double_dash="required" help="Extra Bun test arguments after --, including additional files or -t NAME"
'''
run = '''
eval "set -- ${usage_args:-}"
exec bun test "${usage_file?}" "$@"
'''

[tasks."test:package"]
description = "Run test scripts in selected Bun workspaces"
usage = '''
arg "<package>" help="Bun workspace name or glob, e.g. @hive/shared or @hive/colony"
arg "[args]" var=#true double_dash="required" help="Extra package test arguments after --, e.g. -t NAME"
'''
run = '''
eval "set -- ${usage_args:-}"
exec bun run --filter "${usage_package?}" test "$@"
'''

[tasks.hive-ui]
description = "Build and run Hive UI with endpoints from the Colony daemon"
usage = 'arg "[args]" var=#true double_dash="required" help="Daemon-discovery UI arguments after --, e.g. --port 0"'
run = '''
eval "set -- ${usage_args:-}"
bun run --filter @hive/hive-ui build
exec bun run --cwd lib/hive-ui start --daemon "$@"
'''

[tasks."hive-ui:storybook"]
description = "Open the Hive UI component workshop"
usage = 'arg "[args]" var=#true double_dash="required" help="Storybook arguments after --, e.g. --port 6007"'
run = '''
eval "set -- ${usage_args:-}"
exec bun run --cwd lib/hive-ui storybook "$@"
'''

[tasks."hive-ui:storybook:build"]
description = "Build the static Hive UI component workshop"
run = "bun run --cwd lib/hive-ui storybook:build"

[tasks."test:changed"]
description = "Run tests affected by changes from main and report timings"
usage = 'arg "[args]" var=#true double_dash="required" help="Extra Bun test arguments after --, e.g. a test path or -t NAME"'
run = '''
eval "set -- ${usage_args:-}"
exec bun run test:changed "$@"
'''

[tasks.check]
description = "Run final comprehensive verification"
run = "bun run check"

[tasks."beads:sync"]
description = "Receive and publish the shared tracker snapshot"
run = "bun run beads:sync"

[settings]
experimental = true

[daemons.colony-watchdog]
run = 'export PATH="$HOME/.local/bin:$PATH"; exec colony-watchdog'
retry = true
boot_start = true
