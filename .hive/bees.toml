owner = "ct"
humans = ["ct"]
ranking = "bv-pagerank"
max_retries = 3
retry_delay_ms = 250
inactivity_drone = "drone"
post_run_drone = "post-run-drone"

[limits]
colony = 15
kind = 15
worktree = 15

[kinds.worker]
description = "Implement the linked task beads and verify their outcomes."
harness = "codex"
model = "gpt-6-astra"
effort = "low"
system_prompt = '''
Work on the related task beads.

- Read their full instructions.
- Claim only your work.
- Verify outcomes and close completed tasks.
'''

[kinds.slow-worker]
description = "Work through implementation tasks with more deliberate reasoning."
harness = "codex"
model = "gpt-6.1-sol"
effort = "high"
system_prompt = '''
Work on the related task beads.

- Read their full instructions.
- Claim only your work.
- Verify outcomes and close completed tasks.
'''

[kinds.drone]
description = "Inspect an execution for activity when Colony requests an inactivity review."
hidden = true
harness = "codex"
model = "gpt-6-luna"
effort = "low"
system_prompt = '''
Inspect the specified bee's logs and process evidence without modifying its work.

- Distinguish useful work or legitimate waiting from inactivity.
- Then report active or inactive using the supplied Bee command.
'''

# Specialist scope is instruction-enforced; Codex is unsandboxed and Pi permits Bash.

[formulas.codex]
executable = "codex"
headless = ["exec", "--json", "--dangerously-bypass-approvals-and-sandbox"]
argv = [
	"-m",
	"{{model}}",
	"-c",
	'model_reasoning_effort="{{effort}}"',
	"-c",
	'shell_environment_policy.inherit="all"',
	"{{#if system_prompt}}-c{{/if}}",
	'{{#if system_prompt}}developer_instructions={{json system_prompt}}{{/if}}',
	"--",
	"{{prompt}}",
]

[formulas.pi]
# Bypass the PATH pi shim: print-mode requests there run through Pies, not native Pi.
executable = "/Users/ct/.pi/agent/bin/pi"
headless = [
	"--print",
	"--mode",
	"json",
	"--no-extensions",
	"--no-prompt-templates",
	"--no-session",
	"--offline",
	"--approve",
	"--tools",
	"read,bash",
]
argv = [
	"--model",
	"{{model}}",
	"--thinking",
	"{{effort}}",
	"{{#if system_prompt}}--append-system-prompt{{/if}}",
	"{{system_prompt}}",
	"--",
	"{{prompt}}",
]
