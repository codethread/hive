owner = "ct"
humans = ["ct"]
ranking = "bv-pagerank"
max_retries = 3
retry_delay_ms = 250

[limits]
colony = 15
kind = 15
worktree = 15

[kinds.worker]
description = "mutation-scope: mutating; Implement the linked task beads and verify their outcomes."
harness = "pi"
model = "openai-codex/gpt-6.1-sol"
effort = "high"
system_prompt = '''
Work on the related task beads.

- Read their full instructions.
- Claim only your work.
- Verify outcomes and close completed tasks.
'''

[kinds.slow-worker]
description = "mutation-scope: mutating; Work through implementation tasks with more deliberate reasoning."
harness = "pi"
model = "openai-codex/gpt-6.1-sol"
effort = "xhigh"
system_prompt = '''
Work on the related task beads.

- Read their full instructions.
- Claim only your work.
- Verify outcomes and close completed tasks.
'''

# Specialist scope is instruction-enforced; Codex is unsandboxed and Pi permits Bash.

[formulas.codex]
executable = "codex"
headless = ["exec", "--json", "--dangerously-bypass-approvals-and-sandbox"]
argv = [
	"-m",
	"{{model}}",
	"-c",
	'model_reasoning_effort="{{effort}}"',
	"-c",
	'shell_environment_policy.inherit="all"',
	"{{#if system_prompt}}-c{{/if}}",
	'{{#if system_prompt}}developer_instructions={{json system_prompt}}{{/if}}',
	"--",
	"{{prompt}}",
]

# Retained standard-tier Codex formula; overrides inherited fast-mode settings.
[formulas.codex-standard]
executable = "codex"
headless = ["exec", "--json", "--dangerously-bypass-approvals-and-sandbox"]
argv = [
	"-m",
	"{{model}}",
	"-c",
	'model_reasoning_effort="{{effort}}"',
	"-c",
	'service_tier="default"',
	"-c",
	'shell_environment_policy.inherit="all"',
	"{{#if system_prompt}}-c{{/if}}",
	'{{#if system_prompt}}developer_instructions={{json system_prompt}}{{/if}}',
	"--",
	"{{prompt}}",
]

[formulas.pi]
# Bypass the PATH pi shim: print-mode requests there run through Pies, not native Pi.
executable = "pi-bolt"
headless = ["--print", "--mode", "json", "--approve"]
argv = [
	"--model",
	"{{model}}",
	"--thinking",
	"{{effort}}",
	"{{#if system_prompt}}--append-system-prompt{{/if}}",
	"{{system_prompt}}",
	"--",
	"{{prompt}}",
]
